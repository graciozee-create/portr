plugins {
    id 'net.neoforged.moddev' version '2.0.84'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url 'https://maven.neoforged.net/releases' }
    exclusiveContent {
        forRepository {
            maven {
                name = 'GeckoLib'
                url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
            }
        }
        filter {
            includeGroup('software.bernie.geckolib')
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'SmartBrainLib'
                url = 'https://dl.cloudsmith.io/public/tslat/sbl/maven/'
            }
        }
        filter {
            includeGroup('net.tslat.smartbrainlib')
        }
    }
    maven { url 'https://maven.terraformersmc.com/releases/' }
    maven { url 'https://maven.shedaniel.me/' }
}

neoForge {
    minecraftVersion = project.minecraft_version
    version = project.neo_version
}

dependencies {
    compileOnly "software.bernie.geckolib:geckolib-neoforge-1.21.1:4.9.2"
    compileOnly "net.tslat.smartbrainlib:SmartBrainLib-neoforge-1.21.1:1.16.10"
    compileOnly "me.shedaniel.cloth:cloth-config-neoforge:19.0.147"
    runtimeOnly "com.terraformersmc:modmenu:15.0.0"
    runtimeOnly "me.shedaniel.cloth:cloth-config-neoforge:19.0.147"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(21)
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    manifest {
        attributes([
                'Specification-Title': 'Pleasure Horizons',
                'Specification-Vendor': 'colorgarden',
                'Specification-Version': project.version,
                'Implementation-Title': project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor': 'colorgarden'
        ])
    }
}
