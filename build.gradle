plugins {
    id 'net.neoforged.moddev' version '2.0.143'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url 'https://maven.neoforged.net/releases' }
    exclusiveContent {
        forRepository {
            maven {
                name = 'GeckoLib'
                url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
            }
        }
        filter {
            includeGroup('software.bernie.geckolib')
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'SmartBrainLib'
                url = 'https://dl.cloudsmith.io/public/tslat/sbl/maven/'
            }
        }
        filter {
            includeGroup('net.tslat.smartbrainlib')
        }
    }
    maven { url 'https://maven.terraformersmc.com/releases/' }
    maven { url 'https://maven.shedaniel.me/' }
}

neoForge {
    version = project.neo_version

    mods {
        "pleasurehorizons" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    implementation "software.bernie.geckolib:geckolib-neoforge-1.21.1:${project.geckolib_version}"
    implementation "net.tslat.smartbrainlib:SmartBrainLib-neoforge-1.21.1:${project.sbl_version}"
    implementation "me.shedaniel.cloth:cloth-config-neoforge:${project.cloth_config_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(21)
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    manifest {
        attributes([
                'Specification-Title': 'Pleasure Horizons',
                'Specification-Vendor': 'colorgarden',
                'Specification-Version': project.version,
                'Implementation-Title': project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor': 'colorgarden'
        ])
    }
}
